<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17" />
      <stop offset="100%" stop-color="#07070b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg-gradient)" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="2" />
  <!-- Monogram DG -->
  <text x="50" y="64" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="url(#dg-gradient)" filter="url(#glow)" letter-spacing="-1">DG</text>
</svg>
